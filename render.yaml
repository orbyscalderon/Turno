# Despliegue en Render.com (Blueprint). Crea BD + backend + frontend estático.
# Uso: en Render → New → Blueprint → apunta a este repo.
databases:
  - name: turno-db
    databaseName: turno
    user: turno
    plan: free

services:
  # Backend API (Node, Docker)
  - type: web
    name: turno-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: turno-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: turno-web
          property: host
      - key: APP_URL
        fromService:
          type: web
          name: turno-web
          property: host
      - key: PAYMENT_PROVIDER
        value: mock          # cambia a "stripe" y añade STRIPE_* para cobrar de verdad
      - key: EMAIL_TRANSPORT
        value: dev           # cambia a "smtp" y añade SMTP_* para enviar emails

  # Frontend estático (build de Vite)
  - type: web
    name: turno-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Proxy de la API al backend
      - type: rewrite
        source: /api/*
        destination: https://turno-api.onrender.com/api/*
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
