server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión de los recursos de texto (el bundle y la hoja de estilos).
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los assets con hash en el nombre no cambian nunca: caché agresiva.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html NO se cachea: es quien apunta a la versión nueva de los assets.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta desconocida sirve index.html
  # (cubre /negocio/:slug, /precios, /reset/:token, /pago/paypal/:id...).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy de API, imágenes y sitemap al backend (servicio "backend" en docker-compose).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
  }
  # El sitemap lo genera el backend con los negocios activos.
  location = /sitemap.xml {
    proxy_pass http://backend:4000/api/sitemap.xml;
    proxy_set_header Host $host;
  }
}
