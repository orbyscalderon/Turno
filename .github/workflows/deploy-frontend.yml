name: Deploy Frontend (Cloudflare Pages)

# Despliega el frontend a Cloudflare Pages en cada push a main que toque el frontend.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build (apuntando al backend de Railway)
        working-directory: frontend
        env:
          VITE_API_URL: https://turno-api-production.up.railway.app
        run: npm run build

      - name: Desplegar a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=turno --branch=main
